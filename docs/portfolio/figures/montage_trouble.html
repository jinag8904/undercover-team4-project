<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;background:#fff;font-family:"Malgun Gothic","Segoe UI",sans-serif;color:#1e293b}
 .row{display:flex;align-items:flex-start;padding:16px 20px}
 .step{width:180px;text-align:center}
 .step .img{width:150px;height:150px;margin:0 auto;border-radius:10px;background:#2b2f36;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;overflow:hidden}
 .step.cur .img{border-color:#0f766e}
 .step canvas{width:150px;height:150px;image-rendering:pixelated}
 .step .txt{font-size:11px;line-height:1.5;color:#e2e8f0;text-align:left;padding:12px;font-family:Consolas,"Malgun Gothic",monospace}
 .step .n{font-size:12px;font-weight:700;margin-top:10px}
 .step .p{font-size:11px;color:#b91c1c;margin-top:4px;line-height:1.4}
 .step.cur .p{color:#065f46}
 .arrow{width:48px;height:150px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="row" id="row"></div>
<script>
const P='montage_assets/';
const files={base:'Montage_Base.png',hair:'Montage_HairStyle_7.png',hairUnknown:'Montage_HairUnknown.png',beard:'Montage_FacialHair_1.png',hat:'Montage_Headwear_2.png',hatUnknown:'Montage_HatUnknown.png'};
const hairColor='rgb(116,76,56)', unknownTint='rgba(184,184,189,0.35)';
function load(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=P+src;});}
function tinted(img,color){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.drawImage(img,0,0,128,128);if(color){x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,128,128);}return c;}
function compose(layers){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');layers.forEach(l=>x.drawImage(l,0,0));return c;}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function step(content,n,p,cur){const d=el('div','step'+(cur?' cur':''));const im=el('div','img');im.appendChild(content);d.appendChild(im);d.appendChild(el('div','n',n));d.appendChild(el('div','p',p));return d;}
function arrow(){const d=el('div','arrow');d.innerHTML='<svg width="36" height="20"><path d="M0 10 H26" stroke="#334155" stroke-width="2"/><path d="M24 3 L34 10 L24 17 z" fill="#334155"/></svg>';return d;}
(async()=>{
 const im={};for(const k in files)im[k]=await load(files[k]);
 const L={base:tinted(im.base,null),hair:tinted(im.hair,hairColor),hairU:tinted(im.hairUnknown,'rgb(160,160,166)'),beard:tinted(im.beard,null),hat:tinted(im.hat,null)};
 const r=document.getElementById('row');
 // ① text
 const t=el('div','txt');t.innerHTML='<b style="color:#fbbf24">머리 스타일: 미상</b><br>수염: 콧수염<br>모자: 없음<br>안경: 없음';
 r.appendChild(step(t,'① 글로 표현','읽어야 안다 —|한눈에 대조가 안 됨',false));
 r.appendChild(arrow());
 // ② portrait, revealed only
 r.appendChild(step(compose([L.base,L.beard]),'② 초상화','머리를 안 그리니|대머리와 모른다가 같아 보임',false));
 r.appendChild(arrow());
 // ③ unknown drawn
 const u=compose([L.base,L.beard,L.hairU]);
 r.appendChild(step(u,'③ 미상을 그림으로','모르는 머리는 점선 —|처음 보면 뜻을 못 알아봄',false));
 r.appendChild(arrow());
 // ④ all revealed
 r.appendChild(step(compose([L.base,L.hair,L.beard]),'④ 공개 축 수를 최대로','미상이 아예 안 생김 —|그림과 닮은 사람만 찾으면 끝',true));
 document.querySelectorAll('.p').forEach(e=>e.innerHTML=e.textContent.replace('|','<br>'));
})();
</script>
</body></html>
