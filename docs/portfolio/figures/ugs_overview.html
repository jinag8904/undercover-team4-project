<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;background:#fff;font-family:"Malgun Gothic","Segoe UI",sans-serif}
 svg{display:block}
 .b{font-weight:700}
 .mono{font-family:Consolas,"Malgun Gothic",monospace}
 .muted{fill:#64748b;font-size:12px}
</style></head><body>
<svg width="1240" height="600" viewBox="0 0 1240 600" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
 </defs>
 <rect x="10" y="10" width="1220" height="580" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
 <text x="30" y="42" class="b" font-size="17" fill="#334155">UGS 사용 구조</text>
 <text x="160" y="42" class="muted" font-size="13">초기화 한 번 → 인증이 PlayerId 발급 → 나머지 서비스는 전부 그 PlayerId를 열쇠로 쓴다</text>

 <!-- Core -->
 <rect x="40" y="66" width="1160" height="46" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
 <text x="60" y="88" class="b" font-size="14" fill="#1e293b">Unity Services Core</text>
 <text x="230" y="88" class="mono" font-size="13" fill="#334155">UnityServices.InitializeAsync(env, profile)</text>
 <text x="600" y="88" class="muted">앱당 1회, AuthBootstrap이 수행 · 프로필로 로컬 계정 슬롯 분리(MPPM) · 이게 안 되면 아래 전부 사용 불가</text>
 <text x="60" y="105" class="muted" font-size="11">패키지: com.unity.services.core</text>

 <line x1="620" y1="112" x2="620" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

 <!-- Authentication -->
 <rect x="40" y="134" width="1160" height="84" rx="12" fill="#fff6e6" stroke="#e7c48d" stroke-width="1.5"/>
 <text x="60" y="158" class="b" font-size="14" fill="#7c3a00">Authentication</text>
 <text x="190" y="158" class="muted">AuthBootstrap</text>
 <text x="60" y="180" class="mono" font-size="13" fill="#334155">SignInAnonymouslyAsync · SignInWithUsernamePasswordAsync · AddUsernamePasswordAsync(연동)</text>
 <text x="60" y="200" class="muted">익명 로그인 = 기기 토큰 → PlayerId. 계정 연동은 그 PlayerId에 아이디/비번을 붙이는 것(승격) — ID는 안 바뀐다</text>
 <rect x="880" y="148" width="300" height="56" rx="10" fill="#fff" stroke="#e7c48d"/>
 <text x="1030" y="172" text-anchor="middle" class="b mono" font-size="14" fill="#7c3a00">PlayerId</text>
 <text x="1030" y="192" text-anchor="middle" class="muted" font-size="11">아래 세 서비스가 공유하는 단 하나의 신원</text>

 <!-- three arrows down from PlayerId -->
 <g stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ao)">
  <path d="M 1030 204 L 1030 230 L 240 230 L 240 250" fill="none"/>
  <path d="M 1030 230 L 620 230 L 620 250" fill="none"/>
  <path d="M 1030 230 L 1000 230 L 1000 250" fill="none"/>
 </g>

 <!-- Multiplayer -->
 <rect x="40" y="254" width="370" height="200" rx="12" fill="#e8f0fe" stroke="#a9c0ea" stroke-width="1.5"/>
 <text x="60" y="278" class="b" font-size="14" fill="#1e3a8a">Multiplayer Services</text>
 <text x="60" y="296" class="muted" font-size="11">com.unity.services.multiplayer — Lobby + Relay 묶음</text>
 <text x="60" y="318" class="muted">담당: SessionManager</text>
 <g font-size="12" fill="#1e3a8a">
  <text x="60" y="342">· Lobby — 방 코드·인원·프로퍼티(ver)</text>
  <text x="60" y="362">· Relay — NAT 넘는 중계 서버</text>
  <text x="60" y="382">· WithRelayNetwork() → NGO StartHost/Client 자동</text>
 </g>
 <text x="60" y="410" class="muted" font-size="11">PlayerId 용도: 세션 멤버 목록의 키.</text>
 <text x="60" y="426" class="muted" font-size="11">clientId(NGO) ↔ PlayerId 대응은 SessionRoster가 든다</text>
 <text x="60" y="442" class="muted" font-size="11">→ 세션 중 PlayerId가 바뀌면 안 되는 이유</text>

 <!-- Vivox -->
 <rect x="435" y="254" width="370" height="200" rx="12" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="1.5"/>
 <text x="455" y="278" class="b" font-size="14" fill="#5b21b6">Vivox</text>
 <text x="455" y="296" class="muted" font-size="11">com.unity.services.vivox — 음성 채팅</text>
 <text x="455" y="318" class="muted">담당: VivoxManager</text>
 <g font-size="12" fill="#5b21b6">
  <text x="455" y="342">· LoginAsync(DisplayName = PlayerId)</text>
  <text x="455" y="362">· Radio 채널 (전체 무전) + Proximity 채널 (근접·위치)</text>
  <text x="455" y="382">· 채널 이름 = 접두사 + 세션 Id → 방마다 격리</text>
 </g>
 <text x="455" y="410" class="muted" font-size="11">PlayerId 용도: 참가자 식별 — "누가 말하는 중"을</text>
 <text x="455" y="426" class="muted" font-size="11">Participant.PlayerId로 받아 로비 명부·이름표에 표시</text>
 <text x="455" y="442" class="muted" font-size="11">세션 이벤트(OnSessionJoined/Left)를 보고 입·퇴장</text>

 <!-- Cloud Save -->
 <rect x="830" y="254" width="370" height="200" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
 <text x="850" y="278" class="b" font-size="14" fill="#065f46">Cloud Save</text>
 <text x="850" y="296" class="muted" font-size="11">com.unity.services.cloudsave — 플레이어 단위 KV 저장소</text>
 <text x="850" y="318" class="muted">담당: SaveService · CosmeticsSaveService (둘 다 static)</text>
 <g font-size="12" fill="#065f46">
  <text x="850" y="342">· Data.Player.SaveAsync / LoadAsync / DeleteAsync</text>
  <text x="850" y="362">· "session_progress" — 판 진행 (호스트 계정에 저장)</text>
  <text x="850" y="382">· "player_cosmetics" — 로봇 색·설정 (각자 계정)</text>
 </g>
 <text x="850" y="410" class="muted" font-size="11">PlayerId 용도: 저장소 자체가 PlayerId 단위. 판 세이브 안의</text>
 <text x="850" y="426" class="muted" font-size="11">개인 지갑도 clientId가 아닌 PlayerId로 기록 → 누가 방장이든</text>
 <text x="850" y="442" class="muted" font-size="11">각자 자기 잔액을 되찾는다</text>

 <!-- bottom: lifecycle coupling -->
 <rect x="40" y="474" width="1160" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
 <text x="60" y="498" class="b" font-size="14" fill="#1e293b">서비스끼리 어떻게 엮이나 — 직접 부르지 않고 이벤트로</text>
 <g font-size="12" fill="#334155">
  <text x="60" y="522">로그인 완료 → CosmeticsSaveService.RestoreAsync (색·설정 복원) · 세션 화면 진입 → SaveService.RefreshAsync (이어하기 유무 조회)</text>
  <text x="60" y="542"><tspan class="mono">Session.OnSessionJoined(id)</tspan> → Vivox.JoinChannel(Radio+id) · SaveService.Pending을 호스트가 읽어 라운드 복원</text>
  <text x="60" y="562"><tspan class="mono">Session.OnSessionLeft / OnConnectionLost</tspan> → Vivox 채널 이탈 · Cloud Save는 씬 전환 길목에서 이미 저장됨(호스트) → 잃는 것 없음</text>
 </g>
</svg>
</body></html>
