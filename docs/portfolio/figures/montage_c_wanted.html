<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;background:#fff;font-family:"Malgun Gothic","Segoe UI",sans-serif}
 svg{display:block}
 .b{font-weight:700}
 .mono{font-family:Consolas,"Malgun Gothic",monospace}
</style></head><body>
<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <marker id="mg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <marker id="mr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  <marker id="ma" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  <marker id="mb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <!-- wanted poster -->
  <symbol id="poster" viewBox="0 0 60 80">
   <rect x="2" y="2" width="56" height="76" rx="3" fill="#e8d5a8" stroke="#8a6d3b" stroke-width="2"/>
   <text x="30" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#5a3e1b" font-family="Georgia,serif">WANTED</text>
   <rect x="12" y="20" width="36" height="36" rx="3" fill="#fff" stroke="#c9b083"/>
   <circle cx="30" cy="33" r="8" fill="#334155"/>
   <path d="M 17 56 C 17 44 43 44 43 56 Z" fill="#334155"/>
   <rect x="14" y="61" width="32" height="4" rx="2" fill="#5a3e1b"/>
   <rect x="18" y="68" width="24" height="4" rx="2" fill="#a68a5b"/>
  </symbol>
 </defs>

 <!-- ===== board (NetworkList) ===== -->
 <rect x="230" y="30" width="390" height="180" rx="14" fill="#f4f8ff" stroke="#a9c0ea" stroke-width="2"/>
 <text x="425" y="56" text-anchor="middle" class="b" font-size="14" fill="#1e3a8a">수배 리스트</text>
 <text x="425" y="74" text-anchor="middle" class="mono" font-size="11" fill="#475569">서버 · NetworkList&lt;WantedEntry&gt;</text>
 <use href="#poster" x="270" y="92" width="72" height="96"/>
 <use href="#poster" x="384" y="92" width="72" height="96"/>
 <!-- empty slot (removed) -->
 <rect x="512" y="94" width="70" height="92" rx="4" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
 <text x="547" y="146" text-anchor="middle" font-size="11" fill="#94a3b8">검거됨</text>

 <!-- ===== publish (left) ===== -->
 <g>
  <use href="#poster" x="60" y="92" width="72" height="96"/>
  <text x="96" y="210" text-anchor="middle" class="b" font-size="13" fill="#065f46">몽타주 발행</text>
  <text x="96" y="226" text-anchor="middle" font-size="11" fill="#64748b">범인마다 한 장</text>
  <line x1="140" y1="140" x2="222" y2="140" stroke="#0f766e" stroke-width="2.2" marker-end="url(#mg)"/>
 </g>

 <!-- ===== archive (right) ===== -->
 <g>
  <rect x="740" y="92" width="150" height="118" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="815" y="114" text-anchor="middle" class="b" font-size="13" fill="#475569">서버 보관함</text>
  <use href="#poster" x="790" y="122" width="50" height="66"/>
  <text x="815" y="204" text-anchor="middle" font-size="11" fill="#94a3b8">그대로 보관</text>
 </g>
 <!-- arrest: board -> archive -->
 <line x1="626" y1="122" x2="732" y2="122" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
 <text x="679" y="110" text-anchor="middle" class="b" font-size="12" fill="#b91c1c">검거</text>
 <!-- escape: archive -> board -->
 <line x1="732" y1="176" x2="626" y2="176" stroke="#b45309" stroke-width="2.2" marker-end="url(#ma)"/>
 <text x="679" y="196" text-anchor="middle" class="b" font-size="12" fill="#b45309">탈출</text>

 <!-- ===== UI (below) ===== -->
 <line x1="425" y1="210" x2="425" y2="246" stroke="#1d4ed8" stroke-width="2" marker-end="url(#mb)"/>
 <rect x="315" y="250" width="220" height="40" rx="20" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
 <text x="425" y="268" text-anchor="middle" class="b" font-size="12" fill="#1d4ed8">본부 UI · 전 클라이언트</text>
 <text x="425" y="283" text-anchor="middle" class="mono" font-size="11" fill="#1d4ed8">OnListChanged → 다시 그림</text>
</svg>
</body></html>
