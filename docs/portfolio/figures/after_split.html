<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;background:#fff;font-family:"Malgun Gothic","Segoe UI",sans-serif}
 svg{display:block}
 .b{font-weight:700}
 .mono{font-family:Consolas,"Malgun Gothic",monospace}
 .muted{fill:#64748b;font-size:13px}
 .g{fill:#14532d}
 .bl{fill:#1e3a8a}
</style></head><body>
<svg width="1240" height="660" viewBox="0 0 1240 660" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <marker id="inh" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L12,7 L0,14 z" fill="#fff" stroke="#15803d" stroke-width="1.5"/></marker>
 </defs>

 <rect x="10" y="10" width="1220" height="640" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
 <text x="30" y="42" class="b" font-size="17" fill="#334155">분리 후 — 종류 하나 = 컴포넌트 하나</text>
 <text x="330" y="42" class="muted">공통 골격은 abstract 부모에, 종류별 차이는 상속으로 — Set·enum 분기 없음</text>

 <!-- Manager -->
 <rect x="50" y="66" width="1140" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
 <text x="70" y="92" class="b" font-size="16" fill="#1e293b">SuddenEventManager</text>
 <text x="70" y="113" class="muted">돌발 이벤트 풀 — 인스펙터 리스트에 ISuddenEvent 컴포넌트를 직접 등록</text>

 <!-- arrow Base -> Manager -->
 <line x1="620" y1="182" x2="620" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
 <text x="635" y="152" class="mono" font-size="13" fill="#334155">: ISuddenEvent</text>
 <text x="635" y="170" class="muted">각 이벤트가 직접 등록 — Set·Provider 계층 삭제</text>

 <!-- Base box -->
 <rect x="50" y="186" width="1140" height="230" rx="14" fill="#e8f0fe" stroke="#a9c0ea" stroke-width="1.5"/>
 <text x="70" y="216" class="b bl" font-size="17">SpawnedNpcEventBase.cs  ·  340줄</text>
 <text x="70" y="238" class="muted">abstract MonoBehaviour, ISuddenEvent — 공통 골격. GameObject에 직접 붙고 Awake/OnEnable/OnDisable도 직접 받는다</text>

 <!-- left column: 공통이 맡는 것 -->
 <text x="70" y="270" class="b bl" font-size="13">공통이 맡는 것 (파생은 손대지 않음)</text>
 <g font-size="13" fill="#1e3a8a">
  <text x="70" y="294">· 스폰 위치 탐색 · NavMesh 샘플 · NGO Spawn 복제</text>
  <text x="70" y="316">· 제압 → 연행 → 경범죄 판정 (ArrestJudge 구독)</text>
  <text x="70" y="338">· 소란 지속 타이머 · 도심 잔류 · 스폰물 정리</text>
  <text x="70" y="360">· CanTrigger / ServerBegin / ServerTick / ServerReset</text>
  <text x="70" y="382">· 발생 알림 (AnnounceOnBegin · NoticeKey — virtual)</text>
 </g>

 <line x1="600" y1="262" x2="600" y2="400" stroke="#a9c0ea" stroke-dasharray="4 4"/>

 <!-- right column: 훅 -->
 <text x="625" y="270" class="b bl" font-size="13">파생이 채우는 훅</text>
 <g class="mono" font-size="13" fill="#1e293b">
  <text x="625" y="294">abstract</text><text x="700" y="294">ApplyBehavior(npc)</text><text x="910" y="294" class="muted">스폰 직후 행동 (필수)</text>
  <text x="625" y="316">abstract</text><text x="700" y="316">RiotBehavior</text><text x="910" y="316" class="muted">탈옥 후 재개 행동 (필수)</text>
  <text x="625" y="338">virtual</text><text x="700" y="338">OnSpawned·OnServerTick</text><text x="910" y="338" class="muted">개체 초기화 · 고유 진행</text>
  <text x="625" y="360">virtual</text><text x="700" y="360">OnCaptured</text><text x="910" y="360" class="muted">제압당한 순간의 결말</text>
  <text x="625" y="382">virtual</text><text x="700" y="382">OnReleasing·OnDespawning</text><text x="910" y="382" class="muted">손 뗄 때 · 사라질 때 정리</text>
 </g>

 <!-- inheritance arrows: derived -> base -->
 <g stroke="#15803d" stroke-width="1.5" marker-end="url(#inh)">
  <line x1="240" y1="466" x2="240" y2="422"/>
  <line x1="620" y1="466" x2="620" y2="422"/>
  <line x1="1000" y1="466" x2="1000" y2="422"/>
 </g>
 <text x="1010" y="447" class="muted" font-size="12">상속</text>

 <!-- derived cards -->
 <g font-size="13">
  <rect x="50" y="470" width="360" height="150" rx="12" fill="#e9f7ee" stroke="#a7d7b8" stroke-width="1.5"/>
  <text x="70" y="498" class="b g" font-size="16">RioterEvent.cs</text><text x="215" y="498" class="b g" font-size="14">17줄</text>
  <text x="70" y="520" class="muted">거리 난동자</text>
  <text x="70" y="548" class="mono" fill="#14532d">RiotBehavior  => Resist</text>
  <text x="70" y="570" class="mono" fill="#14532d">ApplyBehavior => StartResist()</text>
  <text x="70" y="598" class="muted">고유 코드 1줄 — 나머지는 전부 부모</text>

  <rect x="430" y="470" width="360" height="150" rx="12" fill="#e9f7ee" stroke="#a7d7b8" stroke-width="1.5"/>
  <text x="450" y="498" class="b g" font-size="16">StreakerEvent.cs</text><text x="615" y="498" class="b g" font-size="14">19줄</text>
  <text x="450" y="520" class="muted">나체 난동꾼</text>
  <text x="450" y="548" class="mono" fill="#14532d">RiotBehavior  => Flee</text>
  <text x="450" y="570" class="mono" fill="#14532d">ApplyBehavior => StartFlee(threat)</text>
  <text x="450" y="598" class="muted">고유 코드 1줄 — 나머지는 전부 부모</text>

  <rect x="810" y="470" width="380" height="150" rx="12" fill="#e9f7ee" stroke="#15803d" stroke-width="1.5"/>
  <text x="830" y="498" class="b g" font-size="16">PickpocketEvent.cs</text><text x="1010" y="498" class="b g" font-size="14">127줄</text>
  <text x="830" y="520" class="muted">소매치기 — 전용 로직이 자기 파일에만</text>
  <g class="mono" font-size="12" fill="#14532d">
   <text x="830" y="544">ApplyBehavior  → 시민 걸음으로 접근·추격</text>
   <text x="830" y="562">OnServerTick   → 접근 포기 타이머</text>
   <text x="830" y="580">OnCaptured     → 훔친 물건 드롭</text>
   <text x="830" y="598">OnReleasing / OnDespawning → 구독·물건 정리</text>
  </g>
 </g>

 <text x="50" y="642" class="muted" font-size="12">이후 SmugglerCourierEvent · FactionRevengeEvent 도 같은 방식(상속)으로 추가됨</text>
</svg>
</body></html>
