<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;background:#fff;font-family:"Malgun Gothic","Segoe UI",sans-serif}
 svg{display:block}
 .b{font-weight:700}
 .mono{font-family:Consolas,"Malgun Gothic",monospace}
 .muted{fill:#64748b;font-size:12px}
</style></head><body>
<svg width="1240" height="520" viewBox="0 0 1240 520" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
 </defs>

 <!-- ===== 로그인 (left) ===== -->
 <rect x="30" y="20" width="400" height="480" rx="14" fill="#fffaf0" stroke="#e7c48d" stroke-width="1.5"/>
 <text x="50" y="50" class="b" font-size="16" fill="#7c3a00">로그인</text>
 <text x="120" y="50" class="muted">AuthBootstrap</text>

 <g font-size="13">
  <rect x="50" y="70" width="360" height="52" rx="10" fill="#fff" stroke="#e7c48d"/>
  <text x="65" y="91" class="b" fill="#7c3a00">① 타이틀 진입</text>
  <text x="65" y="110" class="muted">관문 통과 기록 있으면 로그인 창 생략 → 자동 로그인</text>

  <line x1="230" y1="122" x2="230" y2="136" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="50" y="138" width="360" height="52" rx="10" fill="#fff" stroke="#e7c48d"/>
  <text x="65" y="159" class="b fill" fill="#7c3a00">② UGS 초기화</text>
  <text x="65" y="178" class="mono" font-size="12" fill="#334155">UnityServices.InitializeAsync(env, profile)</text>

  <line x1="230" y1="190" x2="230" y2="204" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="50" y="206" width="360" height="88" rx="10" fill="#fff" stroke="#b45309" stroke-width="2"/>
  <text x="65" y="227" class="b" fill="#7c3a00">③ 익명 로그인</text><text x="180" y="227" class="muted">— 기기 토큰이 신원을 잇는다</text>
  <text x="65" y="246" class="mono" font-size="12" fill="#334155">SignInAnonymouslyAsync</text>
  <text x="65" y="268" fill="#334155">기기에 토큰 있음 → <tspan class="b">같은 PlayerId</tspan> (재실행·복귀)</text>
  <text x="65" y="286" fill="#334155">토큰 없음 → <tspan class="b">새 PlayerId</tspan> (첫 실행·계정 전환)</text>

  <line x1="230" y1="294" x2="230" y2="308" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="50" y="310" width="360" height="52" rx="10" fill="#fff" stroke="#e7c48d"/>
  <text x="65" y="331" class="b" fill="#7c3a00">④ 닉네임 · 연동 상태 복원</text>
  <text x="65" y="350" class="muted">연동 계정은 서버가 정본, 익명은 로컬 캐시가 정본</text>

  <line x1="230" y1="362" x2="230" y2="376" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="50" y="378" width="360" height="36" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="65" y="401" class="b mono" font-size="13" fill="#065f46">OnSignedIn</text>
  <text x="170" y="401" class="muted">→ 세션 화면</text>
 </g>

 <text x="50" y="440" class="muted" font-size="11">· 계정 로그인(아이디/비번)도 같은 흐름 — ③만 계정 로그인으로 바뀐다.</text>
 <text x="50" y="456" class="muted" font-size="11">  실패하면 남겨둔 토큰으로 원래 익명 계정에 복귀한다.</text>
 <text x="50" y="478" class="muted" font-size="11">· 세션 참가 중에는 로그인·계정 전환을 거부한다.</text>
 <text x="50" y="494" class="muted" font-size="11">  PlayerId가 바뀌면 로비 명부·음성 참가자가 어긋나기 때문.</text>

 <!-- ===== 세션 (right) ===== -->
 <rect x="460" y="20" width="750" height="480" rx="14" fill="#f4f8ff" stroke="#a9c0ea" stroke-width="1.5"/>
 <text x="480" y="50" class="b" font-size="16" fill="#1e3a8a">세션</text>
 <text x="530" y="50" class="muted">SessionManager · SDK가 Lobby + Relay + NGO를 한 번에 묶어 준다</text>

 <!-- ① 열기 -->
 <rect x="480" y="70" width="710" height="110" rx="10" fill="#fff" stroke="#a9c0ea"/>
 <text x="495" y="92" class="b" font-size="13" fill="#1e3a8a">① 열기 — 호스트</text>
 <g font-size="12">
  <rect x="495" y="104" width="200" height="60" rx="8" fill="#e8f0fe" stroke="#a9c0ea"/>
  <text x="507" y="124" class="b" fill="#1e3a8a">[방 만들기]</text>
  <text x="507" y="142" class="mono" font-size="11" fill="#334155">CreateSessionAsync</text>
  <text x="507" y="157" class="mono" font-size="11" fill="#334155">(WithRelayNetwork)</text>
  <line x1="697" y1="134" x2="727" y2="134" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="730" y="104" width="240" height="60" rx="8" fill="#fff" stroke="#a9c0ea"/>
  <text x="742" y="124" class="b" fill="#1e3a8a">SDK가 한 번에</text>
  <text x="742" y="142" fill="#334155">Lobby 생성(코드) → Relay 할당</text>
  <text x="742" y="157" fill="#334155">→ NGO StartHost · ver 프로퍼티 기록</text>
  <line x1="972" y1="134" x2="1002" y2="134" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="1005" y="104" width="170" height="60" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1017" y="124" class="b mono" fill="#065f46">OnSessionJoined</text>
  <text x="1017" y="142" fill="#065f46">→ Vivox 채널 입장</text>
  <text x="1017" y="157" fill="#065f46">→ Lobby 씬 로드</text>
 </g>

 <!-- ② 참가 -->
 <rect x="480" y="192" width="710" height="140" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
 <text x="495" y="214" class="b" font-size="13" fill="#1e3a8a">② 참가 — 클라이언트</text>
 <text x="660" y="214" class="muted">버전 검사 2단 — 다른 빌드끼리 붙으면 RPC가 깨진다</text>
 <g font-size="12">
  <rect x="495" y="226" width="200" height="90" rx="8" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="507" y="246" class="b" fill="#5b21b6">[코드로 참가]</text>
  <text x="507" y="264" class="mono" font-size="11" fill="#334155">JoinByCodeAsync(code)</text>
  <text x="507" y="284" fill="#5b21b6">SDK: Lobby 참가 → Relay</text>
  <text x="507" y="299" fill="#5b21b6">→ NGO StartClient</text>
  <line x1="697" y1="271" x2="727" y2="271" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ab)"/>
  <rect x="730" y="226" width="240" height="90" rx="8" fill="#fff" stroke="#1d4ed8"/>
  <text x="742" y="246" class="b" fill="#1e3a8a">B층 · 호스트가 검사</text>
  <text x="742" y="262" fill="#334155">연결 요청 페이로드의 ver ≠ → 거부</text>
  <text x="742" y="286" class="b" fill="#1e3a8a">A층 · 클라가 검사</text>
  <text x="742" y="302" fill="#334155">세션 프로퍼티 ver ≠ → 물러남 + 사유 표시</text>
  <line x1="972" y1="271" x2="1002" y2="271" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ab)"/>
  <rect x="1005" y="226" width="170" height="90" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1017" y="246" class="b mono" fill="#065f46">OnSessionJoined</text>
  <text x="1017" y="264" fill="#065f46">→ Vivox 채널 입장</text>
  <text x="1017" y="282" fill="#065f46">→ 호스트 씬 동기화로</text>
  <text x="1017" y="297" fill="#065f46">   Lobby 따라감</text>
 </g>

 <!-- ③ 닫기 -->
 <rect x="480" y="344" width="710" height="140" rx="10" fill="#fff" stroke="#a9c0ea"/>
 <text x="495" y="366" class="b" font-size="13" fill="#1e3a8a">③ 닫기</text>
 <g font-size="12">
  <rect x="495" y="378" width="300" height="92" rx="8" fill="#e8f0fe" stroke="#a9c0ea"/>
  <text x="507" y="398" class="b" fill="#1e3a8a">호스트 [메인으로] — 자발</text>
  <text x="507" y="416" class="mono" font-size="11" fill="#334155">SessionFlow.LeaveToMainAsync</text>
  <text x="507" y="436" fill="#334155">Vivox 로그아웃 → 세션 삭제(NGO 자동 종료)</text>
  <text x="507" y="452" fill="#334155">→ 종료 대기 → 타이틀 (인증은 유지)</text>
  <line x1="797" y1="424" x2="872" y2="424" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="834" y="416" text-anchor="middle" class="muted" font-size="11" fill="#b91c1c">세션 Deleted</text>
  <rect x="875" y="378" width="300" height="92" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="887" y="398" class="b" fill="#991b1b">클라이언트 — 비자발</text>
  <text x="887" y="416" class="mono" font-size="11" fill="#334155">HandleConnectionLost</text>
  <text x="887" y="436" fill="#334155">드롭·세션 삭제 두 신호를 한 곳에서</text>
  <text x="887" y="452" fill="#334155"><tspan class="mono">OnConnectionLost</tspan>로 정규화 → 타이틀 복귀</text>
 </g>
</svg>
</body></html>
