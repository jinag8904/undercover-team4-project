<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;background:#fff;font-family:"Malgun Gothic","Segoe UI",sans-serif}
 svg{display:block}
 .b{font-weight:700}
 .mono{font-family:Consolas,"Malgun Gothic",monospace}
</style></head><body>
<svg width="520" height="640" viewBox="0 0 520 640" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dcc3"/><stop offset="1" stop-color="#e9bf9c"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6edf9"/><stop offset="1" stop-color="#c7d4ee"/></linearGradient>
  <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#94a3b8"/><stop offset="1" stop-color="#64748b"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity=".14"/></filter>
  <marker id="mp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
  <marker id="ma" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
  <marker id="mn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1e3a8a"/></marker>
  <symbol id="sil" viewBox="0 0 40 64">
   <circle cx="20" cy="11" r="9" fill="currentColor"/>
   <path d="M8 26 q12 -6 24 0 v22 q-12 4 -24 0z" fill="currentColor"/>
   <rect x="10" y="48" width="8" height="14" rx="3" fill="currentColor"/>
   <rect x="22" y="48" width="8" height="14" rx="3" fill="currentColor"/>
  </symbol>
</defs>

<!-- ================= 마네킹 (왼쪽, 전신) ================= -->
<g transform="translate(30,70)" filter="url(#sh)">
  <!-- 다리 -->
  <rect x="62" y="300" width="34" height="120" rx="12" fill="url(#pants)"/>
  <rect x="104" y="300" width="34" height="120" rx="12" fill="url(#pants)"/>
  <!-- 몸 -->
  <path d="M40 132 q60 -30 120 0 v170 q-60 16 -120 0z" fill="url(#body)" stroke="#1e3a8a" stroke-width="2"/>
  <!-- 목 -->
  <rect x="87" y="100" width="26" height="30" rx="7" fill="url(#skin)" stroke="#1e3a8a" stroke-width="2"/>
  <!-- 머리 -->
  <ellipse cx="100" cy="62" rx="44" ry="48" fill="url(#skin)" stroke="#1e3a8a" stroke-width="2"/>
  <!-- 머리카락 (틴트 대상) — 챙 아래로 보이는 앞머리 -->
  <path d="M56 60 a44 44 0 0 1 88 0 q-11 -26 -44 -26 q-33 0 -44 26z" fill="url(#hair)"/>
  <!-- 눈 -->
  <circle cx="84" cy="70" r="2.8" fill="#1e293b"/><circle cx="116" cy="70" r="2.8" fill="#1e293b"/>
  <!-- 안경 (붙은 프롭) -->
  <g fill="none" stroke="#7c3aed" stroke-width="3">
   <rect x="68" y="61" width="27" height="17" rx="6"/><rect x="105" y="61" width="27" height="17" rx="6"/>
   <line x1="95" y1="69" x2="105" y2="69"/>
  </g>
  <!-- 모자 (붙은 프롭) -->
  <path d="M54 38 q46 -50 92 0 l7 4 h-106z" fill="url(#hat)"/>
  <rect x="47" y="40" width="106" height="8" rx="4" fill="#991b1b"/>
  <!-- 머리 본 앵커 -->
  <circle cx="100" cy="22" r="5.5" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="100" cy="22" r="2" fill="#7c3aed"/>
</g>
<text x="130" y="522" text-anchor="middle" class="mono" font-size="11" fill="#475569">NpcAppearance.ApplyProfile</text>

<!-- ================= ① 프롭 — 붙이기 ================= -->
<g transform="translate(280,22)">
  <text x="0" y="14" class="b" font-size="13" fill="#5b21b6">프롭 — 붙이기</text>
  <text x="0" y="32" class="mono" font-size="10.5" fill="#64748b">Instantiate(prefab, headAnchor)</text>
  <g filter="url(#sh)">
   <g transform="translate(0,44)">
    <rect x="0" y="0" width="68" height="46" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-dasharray="4 3"/>
    <path d="M12 31 q22 -26 44 0 l3 2 h-50z" fill="url(#hat)"/>
    <rect x="9" y="32" width="50" height="4" rx="2" fill="#991b1b"/>
   </g>
   <g transform="translate(82,44)">
    <rect x="0" y="0" width="68" height="46" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-dasharray="4 3"/>
    <g fill="none" stroke="#7c3aed" stroke-width="2.5"><rect x="12" y="17" width="18" height="12" rx="4"/><rect x="38" y="17" width="18" height="12" rx="4"/><line x1="30" y1="23" x2="38" y2="23"/></g>
   </g>
   <g transform="translate(164,44)">
    <rect x="0" y="0" width="68" height="46" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-dasharray="4 3"/>
    <path d="M16 21 q18 20 36 0 q-4 18 -18 18 q-14 0 -18 -18z" fill="#4c1d95"/>
   </g>
  </g>
  <text x="34" y="106" text-anchor="middle" font-size="10" fill="#7c3aed">모자</text>
  <text x="116" y="106" text-anchor="middle" font-size="10" fill="#7c3aed">안경</text>
  <text x="198" y="106" text-anchor="middle" font-size="10" fill="#7c3aed">수염</text>
</g>
<!-- 프리팹 → 머리 앵커 -->
<path d="M 280 82 C 230 78, 190 84, 142 90" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mp)"/>
<text x="212" y="70" text-anchor="middle" font-size="10" fill="#7c3aed">머리 본에 붙임</text>

<!-- ================= ② 색 — 칠하기 ================= -->
<g transform="translate(280,178)">
  <text x="0" y="14" class="b" font-size="13" fill="#b45309">색 — 칠하기</text>
  <text x="0" y="32" class="mono" font-size="10.5" fill="#64748b">MaterialPropertyBlock 틴트</text>
  <g transform="translate(0,44)" filter="url(#sh)">
   <rect x="0" y="0" width="232" height="72" rx="10" fill="#fff8ec" stroke="#f1d39b"/>
   <text x="12" y="24" font-size="10" fill="#92400e">머리색</text>
   <g transform="translate(58,10)">
    <rect x="0" y="0" width="22" height="22" rx="5" fill="#111827"/>
    <rect x="28" y="0" width="22" height="22" rx="5" fill="#8b5cf6" stroke="#b45309" stroke-width="2.5"/>
    <rect x="56" y="0" width="22" height="22" rx="5" fill="#d97706"/>
    <rect x="84" y="0" width="22" height="22" rx="5" fill="#e11d48"/>
    <rect x="112" y="0" width="22" height="22" rx="5" fill="#f1f5f9"/>
   </g>
   <text x="12" y="56" font-size="10" fill="#92400e">피부색</text>
   <g transform="translate(58,42)">
    <rect x="0" y="0" width="22" height="22" rx="5" fill="#f6dcc3" stroke="#b45309" stroke-width="2.5"/>
    <rect x="28" y="0" width="22" height="22" rx="5" fill="#d9a066"/>
    <rect x="56" y="0" width="22" height="22" rx="5" fill="#8d5524"/>
   </g>
  </g>
  <text x="116" y="136" text-anchor="middle" font-size="10" fill="#b45309">렌더러별로 덧칠 · 공유 머티리얼은 그대로</text>
</g>
<!-- 팔레트 → 머리카락(관자놀이) / 볼 -->
<path d="M 280 240 C 240 236, 208 178, 180 130" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ma)"/>
<circle cx="166" cy="122" r="9" fill="none" stroke="#d97706" stroke-width="2"/>
<path d="M 280 262 C 240 262, 206 220, 176 170" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ma)"/>
<circle cx="160" cy="160" r="9" fill="none" stroke="#d97706" stroke-width="2"/>

<!-- ================= ③ 바디 — 켜기 ================= -->
<g transform="translate(280,348)">
  <text x="0" y="14" class="b" font-size="13" fill="#1e3a8a">바디 — 켜기</text>
  <text x="0" y="32" class="mono" font-size="10.5" fill="#64748b">variants[i].SetActive(i == index)</text>
  <g transform="translate(0,44)">
   <rect x="0" y="0" width="232" height="64" rx="10" fill="#f4f8ff" stroke="#a9c0ea"/>
   <use href="#sil" x="12" y="8" width="30" height="48" color="#cfd8ea"/>
   <use href="#sil" x="56" y="8" width="30" height="48" color="#1e3a8a"/>
   <use href="#sil" x="100" y="8" width="30" height="48" color="#cfd8ea"/>
   <use href="#sil" x="144" y="8" width="30" height="48" color="#cfd8ea"/>
   <use href="#sil" x="188" y="8" width="30" height="48" color="#cfd8ea"/>
   <rect x="50" y="4" width="42" height="56" rx="8" fill="none" stroke="#1e3a8a" stroke-width="2"/>
  </g>
  <text x="71" y="124" text-anchor="middle" class="mono" font-size="10" fill="#1e3a8a">index 1</text>
  <text x="170" y="124" text-anchor="middle" font-size="10" fill="#64748b">같은 스켈레톤 · 메시 교체 없음</text>
</g>
<!-- 바디 → 몸통 -->
<path d="M 280 424 C 240 430, 215 380, 190 330" fill="none" stroke="#1e3a8a" stroke-width="2" marker-end="url(#mn)"/>

<!-- ================= 결과: int 6개 → 한 사람 ================= -->
<g transform="translate(30,548)">
  <rect x="0" y="0" width="460" height="74" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="14" y="22" class="b" font-size="12" fill="#334155">int 6개 → 한 사람</text>
  <g class="mono" font-size="10.5" fill="#475569">
   <text x="14" y="44">머리스타일 3</text><text x="14" y="62" fill="#7c3aed">→ 프롭</text>
   <text x="92" y="44">머리색 1</text><text x="92" y="62" fill="#b45309">→ 틴트</text>
   <text x="160" y="44">피부색 2</text><text x="160" y="62" fill="#b45309">→ 틴트</text>
   <text x="228" y="44">수염 0</text><text x="228" y="62" fill="#94a3b8">→ 비움</text>
   <text x="286" y="44">모자 4</text><text x="286" y="62" fill="#7c3aed">→ 프롭</text>
   <text x="344" y="44">안경 1</text><text x="344" y="62" fill="#7c3aed">→ 프롭</text>
  </g>
  <text x="446" y="44" text-anchor="end" font-size="10" fill="#94a3b8">어느 피어든</text>
  <text x="446" y="62" text-anchor="end" font-size="10" fill="#94a3b8">같은 사람</text>
</g>
</svg></body></html>
