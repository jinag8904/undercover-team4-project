<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;background:#fff;font-family:"Malgun Gothic","Segoe UI",sans-serif}
 svg{display:block}
 .b{font-weight:700}
 .mono{font-family:Consolas,"Malgun Gothic",monospace}
 .lbl{font-size:12px;fill:#1e293b}
 .sub{font-size:11px;fill:#64748b}
</style></head><body>
<svg width="1240" height="640" viewBox="0 0 1240 640" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="mb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="mr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  <marker id="mg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
 </defs>

 <!-- phase bands -->
 <rect x="20" y="78" width="1200" height="150" rx="10" fill="#f8fafc"/>
 <rect x="20" y="238" width="1200" height="222" rx="10" fill="#eff6ff"/>
 <rect x="20" y="470" width="1200" height="150" rx="10" fill="#fff5f5"/>
 <g class="b" font-size="13">
  <text x="34" y="98" fill="#475569">① 열기</text>
  <text x="34" y="258" fill="#1d4ed8">② 참가 — 버전 검사 2단</text>
  <text x="34" y="490" fill="#b91c1c">③ 닫기</text>
 </g>

 <!-- lifeline heads -->
 <g font-size="14" class="b">
  <rect x="120" y="20" width="160" height="40" rx="10" fill="#e8f0fe" stroke="#a9c0ea" stroke-width="1.5"/>
  <text x="200" y="45" text-anchor="middle" fill="#1e3a8a">호스트</text>
  <rect x="540" y="20" width="160" height="40" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="620" y="45" text-anchor="middle" fill="#334155">UGS  Lobby · Relay</text>
  <rect x="960" y="20" width="160" height="40" rx="10" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="1040" y="45" text-anchor="middle" fill="#5b21b6">클라이언트</text>
 </g>
 <!-- lifelines -->
 <g stroke-dasharray="5 4" stroke-width="1.5">
  <line x1="200" y1="60" x2="200" y2="625" stroke="#a9c0ea"/>
  <line x1="620" y1="60" x2="620" y2="625" stroke="#cbd5e1"/>
  <line x1="1040" y1="60" x2="1040" y2="625" stroke="#c4b5fd"/>
 </g>

 <!-- ===== ① 열기 ===== -->
 <rect x="194" y="108" width="12" height="112" fill="#a9c0ea"/>
 <rect x="614" y="118" width="12" height="40" fill="#cbd5e1"/>

 <line x1="206" y1="120" x2="612" y2="120" stroke="#334155" stroke-width="1.5" marker-end="url(#m)"/>
 <text x="409" y="113" text-anchor="middle" class="lbl mono">CreateSessionAsync(WithRelayNetwork, props{ver})</text>

 <line x1="614" y1="156" x2="208" y2="156" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#m)"/>
 <text x="409" y="149" text-anchor="middle" class="lbl">세션 생성 · 코드 발급 · Relay 할당</text>
 <text x="409" y="172" text-anchor="middle" class="sub">SDK가 NetworkManager.StartHost 까지 수행</text>

 <!-- self: adopt -->
 <path d="M 206 190 L 250 190 L 250 208 L 208 208" fill="none" stroke="#0f766e" stroke-width="1.5" marker-end="url(#mg)"/>
 <text x="260" y="194" class="lbl" fill="#065f46"><tspan class="b">AdoptSession</tspan> → OnSessionJoined</text>
 <text x="260" y="210" class="sub">Vivox 채널 입장 · Lobby 씬 로드 (씬 동기화)</text>

 <!-- ===== ② 참가 ===== -->
 <rect x="1034" y="270" width="12" height="176" fill="#c4b5fd"/>
 <rect x="614" y="278" width="12" height="46" fill="#cbd5e1"/>
 <rect x="194" y="334" width="12" height="46" fill="#a9c0ea"/>

 <line x1="1034" y1="282" x2="628" y2="282" stroke="#334155" stroke-width="1.5" marker-end="url(#m)"/>
 <text x="830" y="275" text-anchor="middle" class="lbl mono">JoinSessionByCodeAsync(code)</text>

 <line x1="626" y1="316" x2="1032" y2="316" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#m)"/>
 <text x="830" y="309" text-anchor="middle" class="lbl">Lobby 참가 · Relay 조인 → NGO StartClient</text>

 <!-- B layer: connection request to host -->
 <line x1="1034" y1="346" x2="208" y2="346" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#mb)"/>
 <text x="620" y="339" text-anchor="middle" class="lbl b" fill="#1d4ed8">NGO 연결 요청 — 페이로드 { ver, sha }</text>
 <text x="620" y="361" text-anchor="middle" class="sub">Relay를 거쳐 호스트에 도착</text>

 <!-- host self: approval gate -->
 <rect x="60" y="368" width="128" height="40" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
 <text x="124" y="384" text-anchor="middle" class="lbl b" fill="#1d4ed8">B층 · 호스트 검사</text>
 <text x="124" y="400" text-anchor="middle" class="sub">ConnectionApprovalGate</text>

 <line x1="206" y1="378" x2="1032" y2="378" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mb)"/>
 <text x="620" y="393" text-anchor="middle" class="lbl" fill="#1d4ed8">ver 같음 → 승인 + 스폰  /  다름 → 거부 + DisconnectReason</text>

 <!-- client self: A layer -->
 <rect x="1050" y="404" width="162" height="40" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
 <text x="1131" y="420" text-anchor="middle" class="lbl b" fill="#1d4ed8">A층 · 클라 검사</text>
 <text x="1131" y="436" text-anchor="middle" class="sub">프로퍼티 ver ≠ → Abandon</text>

 <path d="M 1034 430 L 1000 430 L 1000 448 L 1032 448" fill="none" stroke="#0f766e" stroke-width="1.5" marker-end="url(#mg)"/>
 <text x="990" y="452" text-anchor="end" class="lbl" fill="#065f46"><tspan class="b">AdoptSession</tspan> → OnSessionJoined → Vivox · 호스트 씬 따라 Lobby</text>

 <!-- ===== ③ 닫기 ===== -->
 <rect x="194" y="500" width="12" height="106" fill="#a9c0ea"/>
 <rect x="614" y="522" width="12" height="30" fill="#cbd5e1"/>
 <rect x="1034" y="556" width="12" height="50" fill="#c4b5fd"/>

 <path d="M 206 504 L 250 504 L 250 520 L 208 520" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#m)"/>
 <text x="260" y="508" class="lbl"><tspan class="b">LeaveToMainAsync</tspan> — ① Vivox 로그아웃</text>

 <line x1="206" y1="536" x2="612" y2="536" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#mr)"/>
 <text x="409" y="529" text-anchor="middle" class="lbl mono" fill="#b91c1c">② Session.LeaveAsync</text>
 <text x="409" y="552" text-anchor="middle" class="sub">호스트 = 세션 삭제 → SDK가 NGO Shutdown</text>

 <line x1="626" y1="568" x2="1032" y2="568" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mr)"/>
 <text x="830" y="561" text-anchor="middle" class="lbl" fill="#b91c1c">ISession.Deleted  ·  NGO 연결 끊김</text>

 <path d="M 1034 586 L 1000 586 L 1000 602 L 1032 602" fill="none" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#mr)"/>
 <text x="990" y="590" text-anchor="end" class="lbl" fill="#991b1b"><tspan class="b">HandleConnectionLost</tspan> — 드롭·삭제 신호 정규화</text>
 <text x="990" y="606" text-anchor="end" class="sub">→ OnConnectionLost → ConnectionLostReturner → 타이틀</text>

 <text x="260" y="580" class="lbl">③ NGO 종료 대기 → ④ 타이틀 (인증 유지)</text>
 <text x="260" y="598" class="sub">m_isLeaving 동안 자기 끊김은 OnConnectionLost로 안 바꾼다</text>
</svg>
</body></html>
