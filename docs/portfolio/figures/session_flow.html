<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;background:#fff;font-family:"Malgun Gothic","Segoe UI",sans-serif}
 svg{display:block}
 .b{font-weight:700}
 .mono{font-family:Consolas,"Malgun Gothic",monospace}
 .muted{fill:#64748b;font-size:12px}
</style></head><body>
<svg width="1240" height="720" viewBox="0 0 1240 720" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
 </defs>
 <rect x="10" y="10" width="1220" height="700" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
 <text x="30" y="42" class="b" font-size="17" fill="#334155">세션 과정</text>
 <text x="130" y="42" class="muted" font-size="13">호스트가 열고 → 클라이언트가 들어오고 → 호스트가 닫는다.  SDK(Multiplayer Services)가 Lobby·Relay·NGO 시작/종료를 한 번에 묶어 준다</text>

 <rect x="40" y="60" width="560" height="34" rx="10" fill="#e8f0fe" stroke="#a9c0ea"/>
 <text x="320" y="82" text-anchor="middle" class="b" font-size="14" fill="#1e3a8a">호스트</text>
 <rect x="640" y="60" width="560" height="34" rx="10" fill="#f3e8ff" stroke="#c4b5fd"/>
 <text x="920" y="82" text-anchor="middle" class="b" font-size="14" fill="#5b21b6">클라이언트</text>
 <line x1="620" y1="100" x2="620" y2="700" stroke="#e2e8f0" stroke-dasharray="4 4"/>

 <g class="b" font-size="12" fill="#94a3b8">
  <text x="40" y="118">① 열기</text>
  <text x="40" y="318">② 참가</text>
  <text x="40" y="518">③ 닫기</text>
 </g>

 <g font-size="12">
  <rect x="100" y="104" width="500" height="44" rx="8" fill="#fff" stroke="#a9c0ea"/>
  <text x="112" y="122" class="b" fill="#1e3a8a">SessionPanel [방 만들기] → SessionManager.CreateSessionAsync</text>
  <text x="112" y="139" class="muted">EnsureSignedInAsync — 로그인 안 돼 있으면 여기서 로그인부터</text>

  <line x1="350" y1="148" x2="350" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="100" y="160" width="500" height="44" rx="8" fill="#fff" stroke="#a9c0ea"/>
  <text x="112" y="178" class="b" fill="#1e3a8a">PrepareApprovalGate — 버전 페이로드 스탬프 + ConnectionApprovalCallback 설치</text>
  <text x="112" y="195" class="muted">StartHost 전에 걸어야 실제 요청에 실린다 (#628)</text>

  <line x1="350" y1="204" x2="350" y2="214" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="100" y="216" width="500" height="58" rx="8" fill="#e8f0fe" stroke="#a9c0ea"/>
  <text x="112" y="234" class="b mono" fill="#1e3a8a">MultiplayerService.CreateSessionAsync(options.WithRelayNetwork())</text>
  <text x="112" y="251" class="muted">SDK가 한 번에: Lobby 생성(코드 발급) → Relay 할당 → NetworkManager.StartHost</text>
  <text x="112" y="266" class="muted">SessionProperties에 ver / sha 기록 → 참가자가 읽는다</text>

  <line x1="350" y1="274" x2="350" y2="284" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="100" y="286" width="500" height="26" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="112" y="304" fill="#065f46"><tspan class="b">AdoptSession</tspan> → m_session 저장 · <tspan class="mono">OnSessionJoined</tspan> → Vivox 채널 · Lobby 씬 로드</text>
 </g>

 <g font-size="12">
  <rect x="640" y="104" width="560" height="44" rx="8" fill="#fff" stroke="#c4b5fd"/>
  <text x="652" y="122" class="b" fill="#5b21b6">SessionPanel [코드로 참가] → SessionManager.JoinByCodeAsync(code)</text>
  <text x="652" y="139" class="muted">EnsureSignedInAsync → PrepareApprovalGate (클라도 자기 버전을 페이로드에 싣는다)</text>

  <line x1="920" y1="148" x2="920" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="640" y="160" width="560" height="58" rx="8" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="652" y="178" class="b mono" fill="#5b21b6">MultiplayerService.JoinSessionByCodeAsync(code)</text>
  <text x="652" y="195" class="muted">SDK가 한 번에: Lobby 참가 → Relay 조인 → NetworkManager.StartClient</text>
  <text x="652" y="210" class="muted">→ 호스트의 ConnectionApprovalCallback에 연결 요청이 도착</text>
 </g>

 <path d="M 640 200 L 612 200 L 612 340 L 604 340" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ab)"/>
 <text x="652" y="232" class="muted" font-size="11" fill="#1d4ed8">↳ 연결 요청 (페이로드: ver · sha) → 호스트의 승인 게이트로</text>
 <g font-size="12">
  <rect x="100" y="326" width="500" height="58" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="112" y="344" class="b" fill="#1e3a8a">ConnectionApprovalGate.Approve (B층 — 호스트에서 실행)</text>
  <text x="112" y="361" class="muted">ver ≠ 내 ver → 거부 + DisconnectReason  /  같으면 승인 → SpawnPolicy(스폰)</text>
  <text x="112" y="376" class="muted">sha는 로그만 — 버전 안 올리고 커밋만 다른 경우를 잡아낸다</text>
 </g>
 <path d="M 600 355 L 920 355 L 920 392" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ab)"/>
 <text x="700" y="350" class="muted" font-size="11" fill="#1d4ed8">승인 / 거부</text>

 <g font-size="12">
  <rect x="640" y="396" width="560" height="58" rx="8" fill="#fff" stroke="#c4b5fd"/>
  <text x="652" y="414" class="b" fill="#5b21b6">A층 — 세션 프로퍼티 ver 검사 (클라에서 실행)</text>
  <text x="652" y="431" class="muted">≠ 이면 Abandon: NGO 즉시 Shutdown → 조용히 Leave → 타이틀 복귀 (사유는 매니저가 보관)</text>
  <text x="652" y="446" class="muted">AdoptSession보다 먼저 — 채택하면 Vivox까지 붙어버리므로</text>

  <line x1="920" y1="454" x2="920" y2="464" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="640" y="466" width="560" height="26" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="652" y="484" fill="#065f46"><tspan class="b">AdoptSession</tspan> → <tspan class="mono">OnSessionJoined</tspan> → Vivox 채널 · 호스트 씬 동기화를 따라 Lobby로</text>
 </g>

 <g font-size="12">
  <rect x="100" y="504" width="500" height="76" rx="8" fill="#fff" stroke="#a9c0ea"/>
  <text x="112" y="522" class="b" fill="#1e3a8a">일시정지 [메인으로] → SessionFlow.LeaveToMainAsync</text>
  <text x="112" y="540" class="mono" font-size="11" fill="#1e293b">① Vivox.LogoutAsync  ② Session.LeaveAsync  ③ NGO 종료 대기  ④ Title 로드</text>
  <text x="112" y="557" class="muted">호스트의 LeaveAsync = 세션 삭제 → SDK가 NGO Shutdown → 전원 끊김</text>
  <text x="112" y="572" class="muted">m_isLeaving = true 동안은 자기 드롭 신호를 OnConnectionLost로 안 바꾼다</text>
 </g>
 <path d="M 600 542 L 920 542 L 920 596" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
 <text x="640" y="536" class="muted" font-size="11" fill="#b91c1c">ISession.Deleted  /  NGO OnClientDisconnect</text>
 <g font-size="12">
  <rect x="640" y="600" width="560" height="76" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="652" y="618" class="b" fill="#991b1b">HandleConnectionLost — 두 신호를 한 곳에서 정규화</text>
  <text x="652" y="636" class="muted">m_session = null → <tspan class="mono">OnConnectionLost(SessionClosed | NetworkDropped)</tspan></text>
  <text x="652" y="652" class="muted">→ ConnectionLostReturner: NGO 종료 대기 → Title 복귀 (어느 씬에 있든)</text>
  <text x="652" y="668" class="muted">→ TeardownLostSessionAsync: SDK 레지스트리에서 죽은 세션 제거 (다음 생성이 막히지 않게)</text>
 </g>
 <text x="100" y="620" class="muted">클라가 자발적으로 나가면 본인만 이탈 (호스트·다른 클라는 영향 없음).</text>
 <text x="100" y="638" class="muted">클라가 강제 종료되면 자기 정리를 못 하므로 호스트의 SessionRoster가</text>
 <text x="100" y="656" class="muted">NGO 드롭을 보고 RemovePlayerAsync로 대신 내린다 (#920) — 유령 멤버 방지.</text>
</svg>
</body></html>
