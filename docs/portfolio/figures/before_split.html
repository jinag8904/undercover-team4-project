<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;background:#fff;font-family:"Malgun Gothic","Segoe UI",sans-serif}
 svg{display:block}
 .t{font-size:15px;fill:#334155}
 .b{font-weight:700}
 .mono{font-family:Consolas,"Malgun Gothic",monospace}
 .muted{fill:#64748b;font-size:13px}
 .red{fill:#b91c1c}
</style></head><body>
<svg width="1240" height="620" viewBox="0 0 1240 620" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <marker id="ahr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
 </defs>

 <!-- outer -->
 <rect x="10" y="10" width="1220" height="600" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
 <text x="30" y="42" class="t b" font-size="17">분리 전 — 한 GameObject 위</text>
 <text x="255" y="42" class="muted">SpawnedNpcEventSet(껍데기) 이 SpawnedNpcEvent(데이터) 를 리스트로 담는 구조</text>

 <!-- Manager -->
 <rect x="50" y="66" width="690" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
 <text x="70" y="92" class="t b" font-size="16" fill="#1e293b">SuddenEventManager</text>
 <text x="70" y="113" class="muted">돌발 이벤트 풀 — ISuddenEventProvider 들에게서 이벤트를 걷어간다</text>

 <!-- arrow Set -> Manager -->
 <line x1="395" y1="182" x2="395" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
 <text x="410" y="152" class="mono" font-size="13" fill="#334155">CollectEvents(into)</text>
 <text x="410" y="170" class="muted">Enabled 인 항목만 풀에 얹는다</text>

 <!-- Set box -->
 <rect x="50" y="186" width="690" height="400" rx="14" fill="#fbeaea" stroke="#e3b4b4" stroke-width="1.5"/>
 <text x="70" y="216" class="b" font-size="17" fill="#7f1d1d">SpawnedNpcEventSet.cs  ·  56줄</text>
 <text x="70" y="238" class="muted">MonoBehaviour, ISuddenEventProvider — 로직 없는 배선용 껍데기</text>

 <!-- lifecycle pills -->
 <text x="70" y="270" class="t" font-size="13" fill="#7f1d1d">수명주기 대리 — 항목마다 for 루프로 대신 호출</text>
 <g class="mono" font-size="13">
  <rect x="70" y="280" width="200" height="30" rx="15" fill="#fff" stroke="#e3b4b4"/>
  <text x="170" y="300" text-anchor="middle" fill="#7f1d1d">Awake → Initialize()</text>
  <rect x="285" y="280" width="200" height="30" rx="15" fill="#fff" stroke="#e3b4b4"/>
  <text x="385" y="300" text-anchor="middle" fill="#7f1d1d">OnEnable → Subscribe()</text>
  <rect x="500" y="280" width="220" height="30" rx="15" fill="#fff" stroke="#e3b4b4"/>
  <text x="610" y="300" text-anchor="middle" fill="#7f1d1d">OnDisable → Unsubscribe()</text>
 </g>

 <!-- list -->
 <text x="70" y="345" class="mono" font-size="14" fill="#1e293b">List&lt;SpawnedNpcEvent&gt; m_events</text>
 <text x="345" y="345" class="muted">— 인스펙터 리스트 항목 하나 = 이벤트 1종</text>

 <g font-size="13">
  <rect x="70" y="360" width="200" height="200" rx="12" fill="#fff" stroke="#e3b4b4" stroke-width="1.5"/>
  <text x="85" y="386" class="b" font-size="15" fill="#1e293b">[0] 거리 난동자</text>
  <text x="85" y="412" class="mono" fill="#334155">m_mode = Resist</text>
  <text x="85" y="436" fill="#64748b">m_displayName</text>
  <text x="85" y="456" fill="#64748b">m_npcPrefab</text>
  <text x="85" y="476" fill="#64748b">m_enabled ···</text>

  <rect x="290" y="360" width="200" height="200" rx="12" fill="#fff" stroke="#e3b4b4" stroke-width="1.5"/>
  <text x="305" y="386" class="b" font-size="15" fill="#1e293b">[1] 나체 난동꾼</text>
  <text x="305" y="412" class="mono" fill="#334155">m_mode = Flee</text>
  <text x="305" y="436" fill="#64748b">m_displayName</text>
  <text x="305" y="456" fill="#64748b">m_npcPrefab</text>
  <text x="305" y="476" fill="#64748b">m_enabled ···</text>

  <rect x="510" y="360" width="210" height="200" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="525" y="386" class="b" font-size="15" fill="#1e293b">[2] 소매치기</text>
  <text x="525" y="412" class="mono" fill="#334155">m_mode = Pickpocket</text>
  <text x="525" y="436" fill="#64748b">m_displayName</text>
  <text x="525" y="456" fill="#64748b">m_npcPrefab</text>
  <text x="525" y="476" fill="#64748b">m_enabled ···</text>
  <text x="525" y="506" class="red" font-size="12">+ m_pickpocketApproachSeconds</text>
  <text x="525" y="524" class="red" font-size="12">  (이 항목만 쓰는 필드)</text>
 </g>

 <!-- arrow items -> class -->
 <line x1="745" y1="420" x2="785" y2="420" stroke="#b45309" stroke-width="1.5" marker-end="url(#ahr)"/>
 <text x="768" y="408" text-anchor="middle" class="muted" font-size="12"></text>

 <!-- Class box -->
 <rect x="790" y="186" width="420" height="400" rx="14" fill="#fff6e6" stroke="#e7c48d" stroke-width="1.5"/>
 <text x="810" y="216" class="b" font-size="17" fill="#7c3a00">SpawnedNpcEvent.cs  ·  400줄</text>
 <text x="810" y="238" class="muted">[Serializable] class : ISuddenEvent — MonoBehaviour 아님</text>

 <g font-size="13" fill="#7c3a00">
  <text x="810" y="266">· 붙일 GameObject 없음 → Set 의 리스트 안에만 존재</text>
  <text x="810" y="286">· Awake/OnEnable 못 받음 → Set 이 대신 호출</text>
  <text x="810" y="306">· 인스턴스 3개 = 같은 클래스, m_mode 값만 다름</text>
 </g>

 <line x1="810" y1="322" x2="1190" y2="322" stroke="#e7c48d" stroke-dasharray="4 4"/>

 <g class="mono" font-size="13" fill="#1e293b">
  <text x="810" y="348">enum Behavior { Resist, Flee, Pickpocket }</text>
  <text x="810" y="376">ApplyBehavior()  switch (m_mode)</text>
  <text x="830" y="398">case Resist  → StartResist()</text>
  <text x="1090" y="398" fill="#64748b">// 1줄</text>
  <text x="830" y="418">case Flee    → StartFlee()</text>
  <text x="1090" y="418" fill="#64748b">// 1줄</text>
  <rect x="822" y="428" width="376" height="24" rx="6" fill="#fee2e2"/>
  <text x="830" y="445" class="red">case Pickpocket → 접근·탈취·도주 시퀀스</text>
 </g>

 <g font-size="13">
  <rect x="810" y="466" width="380" height="100" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="825" y="490" class="b red" font-size="13">소매치기 전용 코드가 공용 클래스에</text>
  <text x="825" y="512" class="mono red" font-size="12">HandlePickpocketReach()</text>
  <text x="825" y="530" class="mono red" font-size="12">m_pickpocketGiveUpTime</text>
  <text x="825" y="548" class="mono red" font-size="12">if (IsPickpocketDuty) … 곳곳에 산재</text>
 </g>
</svg>
</body></html>
