<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;background:#fff;font-family:"Malgun Gothic","Segoe UI",sans-serif}
 svg{display:block}
 .b{font-weight:700}
 .mono{font-family:Consolas,"Malgun Gothic",monospace}
 .lbl{font-size:12px;fill:#1e293b}
 .sub{font-size:11px;fill:#64748b}
</style></head><body>
<svg width="1240" height="484" viewBox="0 0 1240 484" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="mb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="mg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <!-- tiny npc figure -->
  <symbol id="npc" viewBox="0 0 40 60">
   <circle cx="20" cy="12" r="9" fill="currentColor"/>
   <rect x="9" y="24" width="22" height="26" rx="6" fill="currentColor"/>
   <rect x="11" y="50" width="7" height="9" rx="2" fill="currentColor"/>
   <rect x="22" y="50" width="7" height="9" rx="2" fill="currentColor"/>
  </symbol>
 </defs>

 <!-- ===== ① profile = 6 indices ===== -->
 <rect x="30" y="20" width="1180" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
 <text x="46" y="42" class="b" font-size="13" fill="#1e293b">① 외형 하나 = 숫자 6개</text>
 <text x="220" y="42" class="sub mono">AppearanceProfile (struct, INetworkSerializable)</text>

 <g font-size="12">
  <!-- six chips -->
  <g transform="translate(46,54)">
   <rect x="0" y="0" width="120" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="60" y="20" text-anchor="middle" class="sub">머리 스타일</text><text x="60" y="42" text-anchor="middle" class="b mono" font-size="16" fill="#1e3a8a">3</text>
   <rect x="130" y="0" width="120" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="190" y="20" text-anchor="middle" class="sub">머리색</text><text x="190" y="42" text-anchor="middle" class="b mono" font-size="16" fill="#1e3a8a">1</text>
   <rect x="260" y="0" width="120" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="320" y="20" text-anchor="middle" class="sub">피부색</text><text x="320" y="42" text-anchor="middle" class="b mono" font-size="16" fill="#1e3a8a">2</text>
   <rect x="390" y="0" width="120" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="450" y="20" text-anchor="middle" class="sub">수염</text><text x="450" y="42" text-anchor="middle" class="b mono" font-size="16" fill="#1e3a8a">0</text>
   <rect x="520" y="0" width="120" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="580" y="20" text-anchor="middle" class="sub">모자</text><text x="580" y="42" text-anchor="middle" class="b mono" font-size="16" fill="#1e3a8a">4</text>
   <rect x="650" y="0" width="120" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="710" y="20" text-anchor="middle" class="sub">안경</text><text x="710" y="42" text-anchor="middle" class="b mono" font-size="16" fill="#1e3a8a">1</text>
  </g>
  <line x1="826" y1="80" x2="858" y2="80" stroke="#334155" stroke-width="1.5" marker-end="url(#m)"/>
  <rect x="862" y="54" width="332" height="52" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="876" y="74" class="lbl b" fill="#065f46">실물은 AppearanceDatabase (SO)가 갖는다</text>
  <text x="876" y="92" class="sub">인덱스 → 메시·프리팹·색. 네트워크엔 숫자 6개만 오간다</text>
 </g>

 <!-- ===== ② server decides, every peer draws ===== -->
 <rect x="30" y="132" width="1180" height="200" rx="12" fill="#f4f8ff" stroke="#a9c0ea" stroke-width="1.5"/>
 <text x="46" y="154" class="b" font-size="13" fill="#1e3a8a">② 정하는 건 서버 하나, 그리는 건 각자</text>
 <text x="300" y="154" class="sub">외형으로 범인을 대조하는 게임 — 전원이 같은 외형을 봐야 한다</text>

 <!-- server -->
 <rect x="46" y="168" width="250" height="150" rx="10" fill="#e8f0fe" stroke="#a9c0ea" stroke-width="1.5"/>
 <text x="60" y="188" class="lbl b" fill="#1e3a8a">서버 (호스트)</text>
 <text x="60" y="208" class="lbl">AppearanceAssigner가 프로필을 정한다</text>
 <text x="60" y="226" class="sub">범인·디코이·나머지 역할별 규칙으로 (몽타주 슬라이드)</text>
 <text x="60" y="252" class="mono" font-size="12" fill="#1e3a8a">npc.SetProfile(profile)</text>
 <text x="60" y="272" class="mono" font-size="12" fill="#1e3a8a">→ m_syncedProfile.Value = profile</text>
 <text x="60" y="292" class="sub mono">NetworkVariable&lt;AppearanceProfile&gt;</text>
 <text x="60" y="308" class="sub">쓰기는 서버만 · 값이 바뀌면 전 피어에 복제</text>

 <!-- arrows to peers -->
 <g stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#mb)">
  <path d="M 296 242 L 340 242 L 340 198 L 384 198" fill="none"/>
  <path d="M 340 242 L 384 242" fill="none"/>
  <path d="M 340 260 L 340 304 L 384 304" fill="none"/>
 </g>
 <text x="340" y="186" text-anchor="middle" class="sub b" fill="#1d4ed8">{3,1,2,0,4,1}</text>

 <!-- three peers -->
 <g font-size="12">
  <rect x="388" y="178" width="230" height="40" rx="8" fill="#fff" stroke="#a9c0ea"/>
  <text x="400" y="195" class="lbl b">호스트 자신</text>
  <text x="400" y="211" class="sub mono">OnValueChanged → ApplyProfile</text>
  <rect x="388" y="222" width="230" height="40" rx="8" fill="#fff" stroke="#a9c0ea"/>
  <text x="400" y="239" class="lbl b">클라 B</text>
  <text x="400" y="255" class="sub mono">OnValueChanged → ApplyProfile</text>
  <rect x="388" y="266" width="230" height="40" rx="8" fill="#fff" stroke="#a9c0ea"/>
  <text x="400" y="283" class="lbl b">클라 C — 늦게 들어옴</text>
  <text x="400" y="299" class="sub">스폰 페이로드에 값이 실려 와 그대로 적용</text>
 </g>

 <!-- same picture on all -->
 <line x1="618" y1="242" x2="650" y2="242" stroke="#0f766e" stroke-width="1.5" marker-end="url(#mg)"/>
 <rect x="654" y="168" width="540" height="150" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
 <text x="668" y="188" class="lbl b" fill="#065f46">셋 다 같은 DB에서 같은 걸 꺼내 그린다 → 화면이 같다</text>
 <g transform="translate(700,204)">
  <use href="#npc" x="0" y="0" width="40" height="60" color="#1e3a8a"/>
  <text x="20" y="80" text-anchor="middle" class="sub">호스트</text>
  <use href="#npc" x="90" y="0" width="40" height="60" color="#1e3a8a"/>
  <text x="110" y="80" text-anchor="middle" class="sub">클라 B</text>
  <use href="#npc" x="180" y="0" width="40" height="60" color="#1e3a8a"/>
  <text x="200" y="80" text-anchor="middle" class="sub">클라 C</text>
  <text x="250" y="30" class="lbl">= 머리 3 · 머리색 1 · 피부 2</text>
  <text x="250" y="48" class="lbl">   수염 0 · 모자 4 · 안경 1</text>
  <text x="250" y="72" class="sub">클라가 임의로 바꿀 방법이 없다 — 서버 권위</text>
 </g>

 <!-- ===== ③ how ApplyProfile draws ===== -->
 <rect x="30" y="344" width="1180" height="126" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
 <text x="46" y="366" class="b" font-size="13" fill="#1e293b">③ ApplyProfile — 숫자 6개를 외형으로 바꾸는 세 가지 손</text>
 <text x="420" y="366" class="sub">NpcAppearance</text>

 <g font-size="12">
  <rect x="46" y="380" width="370" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="400" class="lbl b">바디 — 켜기</text>
  <text x="60" y="424" class="sub mono">variants[i].gameObject.SetActive(i == index)</text>
  <text x="60" y="446" class="sub">같은 스켈레톤 바인딩 → 본 배열 유지</text>

  <rect x="432" y="380" width="370" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="446" y="400" class="lbl b">프롭 — 붙이기</text>
  <text x="446" y="424" class="sub mono">Instantiate(prefab, headAnchor)</text>
  <text x="446" y="446" class="sub">축마다 슬롯 하나 · 바꿀 때 이전 프롭 Destroy</text>

  <rect x="818" y="380" width="376" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="832" y="400" class="lbl b">색 — 칠하기</text>
  <text x="832" y="424" class="sub mono">renderer.SetPropertyBlock(_BaseColor / _Skin_Color)</text>
  <text x="832" y="446" class="sub">공유 머티리얼 불변 → 인스턴스 누수 없음</text>
 </g>
</svg>
</body></html>
