<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;background:#fff;font-family:"Malgun Gothic","Segoe UI",sans-serif}
 svg{display:block}
 .b{font-weight:700}
 .mono{font-family:Consolas,"Malgun Gothic",monospace}
 .muted{fill:#64748b;font-size:13px}
</style></head><body>
<svg width="1240" height="680" viewBox="0 0 1240 680" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <marker id="dn" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <marker id="up" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <marker id="inj" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
 </defs>

 <rect x="10" y="10" width="1220" height="660" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
 <text x="30" y="42" class="b" font-size="17" fill="#334155">로그인 / 세션 구조</text>
 <text x="200" y="42" class="muted">참조는 위 → 아래, 이벤트는 아래 → 위 한 방향 — NGO·세션의 소유자는 SessionManager 하나</text>

 <!-- ===== layer stack ===== -->
 <!-- UI -->
 <rect x="230" y="66" width="500" height="56" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
 <text x="250" y="90" class="b" font-size="15" fill="#1e293b">타이틀 UI</text>
 <text x="340" y="90" class="muted">AuthGatePanel · SessionPanel · 일시정지 패널</text>
 <text x="250" y="112" class="muted">App.Net.Auth / App.Net.Session 파사드로만 매니저에 접근</text>

 <!-- Vivox -->
 <rect x="230" y="150" width="500" height="70" rx="12" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="1.5"/>
 <text x="250" y="176" class="b" font-size="15" fill="#5b21b6">VivoxManager</text>
 <text x="380" y="176" class="muted">음성 — 구독자</text>
 <text x="250" y="200" font-size="13" fill="#5b21b6">OnSessionJoined → 채널 입장 · OnSessionLeft → 채널 퇴장</text>

 <!-- Session -->
 <rect x="230" y="248" width="500" height="176" rx="12" fill="#e8f0fe" stroke="#a9c0ea" stroke-width="1.5"/>
 <text x="250" y="274" class="b" font-size="15" fill="#1e3a8a">SessionManager</text>
 <text x="380" y="274" class="muted">세션 — 단일 소유자</text>
 <text x="250" y="298" class="mono" font-size="13" fill="#1e293b">CreateSessionAsync · JoinByCodeAsync · LeaveAsync</text>
 <text x="250" y="318" class="muted">올라가는 문 2개 · 내려가는 문 1개 — 끊는 모든 경로는 LeaveAsync 통과</text>
 <rect x="250" y="334" width="225" height="72" rx="10" fill="#fff" stroke="#a9c0ea"/>
 <text x="264" y="356" class="b mono" font-size="13" fill="#1e3a8a">ISession</text>
 <text x="264" y="374" class="muted" font-size="12">UGS Lobby + Relay — 코드·인원·ver</text>
 <text x="264" y="392" class="muted" font-size="12">Deleted → 끊김 신호</text>
 <rect x="485" y="334" width="225" height="72" rx="10" fill="#fff" stroke="#a9c0ea"/>
 <text x="499" y="356" class="b mono" font-size="13" fill="#1e3a8a">NetworkManager (NGO)</text>
 <text x="499" y="374" class="muted" font-size="12">SDK가 세션에 붙여 자동 Start / Shutdown</text>
 <text x="499" y="392" class="muted" font-size="12">OnClientDisconnect → 끊김 신호</text>

 <!-- Auth -->
 <rect x="230" y="452" width="500" height="110" rx="12" fill="#fff6e6" stroke="#e7c48d" stroke-width="1.5"/>
 <text x="250" y="478" class="b" font-size="15" fill="#7c3a00">AuthBootstrap</text>
 <text x="380" y="478" class="muted">인증 — leaf, 세션을 모른다</text>
 <text x="250" y="502" font-size="13" fill="#7c3a00">UGS 초기화 → 익명 / 계정 로그인 → PlayerId · 닉네임 · 연동 상태</text>
 <text x="250" y="524" class="mono" font-size="13" fill="#1e293b">Func&lt;bool&gt; CanSignOut = () =&gt; true;</text>
 <text x="560" y="524" class="muted" font-size="12">← 훅만 노출</text>
 <text x="250" y="546" class="mono" font-size="13" fill="#1e293b">SignOut() { if (!CanSignOut()) return; … }</text>

 <!-- ===== left: reference (down) ===== -->
 <line x1="190" y1="150" x2="190" y2="244" stroke="#475569" stroke-width="1.5" marker-end="url(#dn)"/>
 <line x1="190" y1="248" x2="190" y2="448" stroke="#475569" stroke-width="1.5" marker-end="url(#dn)"/>
 <text x="180" y="140" text-anchor="end" class="b" font-size="13" fill="#475569">참조 (컴파일타임)</text>
 <text x="180" y="158" text-anchor="end" class="muted" font-size="12">위 → 아래 한 방향</text>
 <text x="180" y="300" text-anchor="end" class="muted" font-size="12">Vivox → Session</text>
 <text x="180" y="316" text-anchor="end" class="muted" font-size="12">Session → Auth</text>
 <text x="180" y="332" text-anchor="end" class="muted" font-size="12">Auth → 아무도 (leaf)</text>

 <!-- ===== right: events (up, dashed teal) ===== -->
 <line x1="770" y1="452" x2="770" y2="428" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#up)"/>
 <line x1="770" y1="248" x2="770" y2="224" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#up)"/>
 <line x1="770" y1="424" x2="770" y2="252" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="6 4"/>
 <text x="785" y="140" class="b" font-size="13" fill="#0f766e">이벤트 (런타임)</text>
 <text x="785" y="158" class="muted" font-size="12">아래 → 위 한 방향 · 하위는 상위를 모른다</text>
 <g class="mono" font-size="12" fill="#0f766e">
  <text x="785" y="240">OnSessionJoined(id)</text>
  <text x="785" y="256">OnSessionLeft</text>
  <text x="785" y="272">OnConnectionLost(reason)</text>
  <text x="785" y="444">OnSignedIn · OnSignedOut</text>
 </g>

 <!-- ===== gate injection (Session -> Auth) ===== -->
 <path d="M 730 300 C 1000 300, 1000 536, 734 536" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#inj)"/>
 <text x="940" y="330" class="b" font-size="13" fill="#b45309">게이트 역주입 (델리게이트)</text>
 <text x="940" y="350" class="mono" font-size="12" fill="#b45309">m_auth.CanSignOut =</text><text x="940" y="366" class="mono" font-size="12" fill="#b45309">    () =&gt; m_session == null</text>
 <text x="940" y="390" class="muted" font-size="12">Session이 자기 상태를 Auth의 훅에 꽂는다</text>
 <text x="940" y="406" class="muted" font-size="12">→ Auth는 Session을 모른 채 로그아웃 거부</text>
 <text x="940" y="422" class="muted" font-size="12">→ 순환 참조 없음</text>

 <!-- ===== bottom: two flows ===== -->
 <rect x="50" y="588" width="560" height="66" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
 <text x="65" y="608" class="b" font-size="13" fill="#065f46">나가기 (자발) — SessionFlow.LeaveToMainAsync</text>
 <text x="65" y="626" class="mono" font-size="12" fill="#065f46">① Vivox.LogoutAsync → ② Session.LeaveAsync (NGO 자동 종료)</text>
 <text x="65" y="644" class="mono" font-size="12" fill="#065f46">→ ③ NGO 종료 대기 → ④ Title 로드   (인증은 유지)</text>

 <rect x="630" y="588" width="560" height="66" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
 <text x="645" y="608" class="b" font-size="13" fill="#991b1b">끊김 (비자발) — HandleConnectionLost 한 곳에서 정규화</text>
 <text x="645" y="626" class="mono" font-size="12" fill="#991b1b">NGO 드롭 · 세션 Deleted → m_session = null → OnConnectionLost</text>
 <text x="645" y="644" class="mono" font-size="12" fill="#991b1b">→ ConnectionLostReturner → Title 복귀   (자발 중엔 m_isLeaving 가드)</text>
</svg>
</body></html>
