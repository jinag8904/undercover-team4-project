<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;background:#fff;font-family:"Malgun Gothic","Segoe UI",sans-serif}
 svg{display:block}
 .b{font-weight:700}
 .mono{font-family:Consolas,"Malgun Gothic",monospace}
 .muted{fill:#64748b;font-size:12px}
</style></head><body>
<svg width="1240" height="600" viewBox="0 0 1240 600" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <marker id="am" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
 </defs>
 <rect x="10" y="10" width="1220" height="580" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
 <text x="30" y="42" class="b" font-size="17" fill="#334155">로그인 과정</text>
 <text x="160" y="42" class="muted" font-size="13">타이틀 진입 → 관문 → AuthBootstrap.InitializeAndSignInAsync → OnSignedIn</text>

 <rect x="40" y="70" width="230" height="64" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
 <text x="55" y="94" class="b" font-size="14" fill="#1e293b">타이틀 진입</text>
 <text x="55" y="114" class="muted">TitleUIManager · 앱 시작 또는 세션에서 복귀</text>

 <g transform="translate(155,215)">
  <polygon points="0,-55 120,0 0,55 -120,0" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="0" y="-8" text-anchor="middle" font-size="13" fill="#1e293b">관문 통과한 적 있나?</text>
  <text x="0" y="10" text-anchor="middle" class="mono" font-size="11" fill="#64748b">HasPassedAuthGate (이번 실행)</text>
  <text x="0" y="26" text-anchor="middle" class="mono" font-size="11" fill="#64748b">RememberedAuthGate (PlayerPrefs)</text>
 </g>
 <line x1="155" y1="134" x2="155" y2="156" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

 <line x1="155" y1="270" x2="155" y2="330" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
 <text x="165" y="300" class="b" font-size="12" fill="#0f766e">예 → 관문 생략</text>
 <rect x="40" y="334" width="230" height="64" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
 <text x="55" y="358" class="b" font-size="14" fill="#065f46">세션 화면 (SessionPanel)</text>
 <text x="55" y="378" class="muted">뒤에서 Start()의 자동 로그인이 돈다</text>
 <text x="55" y="392" class="muted">(m_signInOnStart · 토큰으로 같은 PlayerId 복귀)</text>

 <line x1="275" y1="215" x2="330" y2="215" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
 <text x="282" y="205" class="b" font-size="12" fill="#b91c1c">아니오</text>
 <rect x="335" y="160" width="250" height="110" rx="12" fill="#fff6e6" stroke="#e7c48d" stroke-width="1.5"/>
 <text x="350" y="184" class="b" font-size="14" fill="#7c3a00">AuthGatePanel (로그인 관문)</text>
 <rect x="350" y="196" width="220" height="24" rx="12" fill="#fff" stroke="#e7c48d"/><text x="460" y="212" text-anchor="middle" font-size="12" fill="#7c3a00">[게스트로 시작] → 익명 로그인</text>
 <rect x="350" y="226" width="220" height="24" rx="12" fill="#fff" stroke="#e7c48d"/><text x="460" y="242" text-anchor="middle" font-size="12" fill="#7c3a00">[로그인] / [가입] → 계정 로그인</text>
 <text x="350" y="264" class="muted" font-size="11">성공 시 MarkAuthGatePassed() → 세션 화면</text>

 <line x1="590" y1="215" x2="640" y2="215" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

 <rect x="645" y="70" width="560" height="330" rx="14" fill="#fff6e6" stroke="#e7c48d" stroke-width="1.5"/>
 <text x="665" y="96" class="b" font-size="15" fill="#7c3a00">AuthBootstrap.InitializeAndSignInAsync</text>
 <text x="665" y="114" class="muted">상주 매니저 (DontDestroyOnLoad) — 모든 로그인 경로가 여기로 모인다</text>

 <g font-size="13">
  <rect x="665" y="128" width="520" height="40" rx="8" fill="#fff" stroke="#e7c48d"/>
  <text x="680" y="145" class="b" fill="#7c3a00">① UnityServices.InitializeAsync(env, profile)</text>
  <text x="680" y="161" class="muted">UGS 초기화 — 프로필로 로컬 계정 슬롯을 나눈다 (MPPM 다중 인스턴스)</text>

  <rect x="665" y="176" width="520" height="54" rx="8" fill="#fff" stroke="#e7c48d"/>
  <text x="680" y="193" class="b" fill="#7c3a00">② 로그인 안 돼 있으면 SignInAnonymouslyAsync</text>
  <text x="680" y="209" class="muted">기기에 세션 토큰 있음 → 같은 PlayerId로 복귀 (앱 재실행·드롭 복귀)</text>
  <text x="680" y="223" class="muted">토큰 없음 → 새 PlayerId 발급 (첫 실행·계정 전환)</text>

  <rect x="665" y="238" width="520" height="40" rx="8" fill="#fff" stroke="#e7c48d"/>
  <text x="680" y="255" class="b" fill="#7c3a00">③ GetPlayerNameAsync</text>
  <text x="680" y="271" class="muted">UGS PlayerName(이름#1234) 확보 — 빼면 Nickname이 빈 문자열</text>

  <rect x="665" y="286" width="520" height="54" rx="8" fill="#fff" stroke="#e7c48d"/>
  <text x="680" y="303" class="b" fill="#7c3a00">④ RefreshAccountStateAsync → RestoreCachedNicknameAsync</text>
  <text x="680" y="319" class="muted">연동 여부를 서버에 확인한 뒤 닉네임 복원 — 순서 고정 (연동 계정은 서버가 정본,</text>
  <text x="680" y="333" class="muted">익명은 로컬 캐시가 정본 · 조회 실패는 "모름"으로 두어 캐시가 덮어쓰지 못하게)</text>

  <rect x="665" y="348" width="520" height="40" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="680" y="365" class="b" fill="#065f46">⑤ SetSigningIn(false) → OnSignedIn 발화</text>
  <text x="680" y="381" class="muted">진행 표시를 끈 뒤 알린다 — "로그인됐는데 아직 로그인 중"인 상태를 구독자가 못 보게</text>
 </g>

 <rect x="40" y="420" width="1165" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
 <text x="60" y="446" class="b" font-size="14" fill="#1e293b">계정 로그인 경로 — SignInWithAccountAsync(username, password)</text>
 <text x="660" y="446" class="muted">익명 → 정식 계정 전환. 실패해도 로그아웃 상태로 남기지 않는다</text>
 <g font-size="12">
  <rect x="60" y="462" width="200" height="50" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="72" y="482" class="b" fill="#334155">형식 검사 · 잠금 검사</text>
  <text x="72" y="500" class="muted" font-size="11">AccountCredentials · 세션 중 거부</text>
  <line x1="262" y1="487" x2="292" y2="487" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="295" y="462" width="230" height="50" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="307" y="482" class="b" fill="#334155">기존 익명 SignOut (토큰은 유지)</text>
  <text x="307" y="500" class="muted" font-size="11">실패 시 이 토큰으로 익명 복귀용</text>
  <line x1="527" y1="487" x2="557" y2="487" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="560" y="462" width="270" height="50" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="572" y="482" class="b" fill="#334155">SignInWithUsernamePasswordAsync</text>
  <text x="572" y="500" class="muted" font-size="11">→ 이름 확보 → 캐시 갱신 → OnSignedIn</text>
  <line x1="832" y1="487" x2="862" y2="487" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#am)"/>
  <rect x="865" y="462" width="320" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="877" y="482" class="b" fill="#991b1b">실패 시 (비밀번호 오류 등)</text>
  <text x="877" y="500" class="muted" font-size="11">익명 재로그인 → 원래 PlayerId 복귀 → throw</text>
 </g>
 <text x="60" y="548" class="muted">잠금 규칙 — 세션 참가 중(IsNetworkConnected) · 세션 전환 중(CanSignOut == false)에는 로그인·연동·전환 전부 거부: PlayerId가 바뀌면 로비·Vivox가 옛 ID를 들고 어긋난다</text>
</svg>
</body></html>
