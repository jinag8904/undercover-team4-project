<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;background:#fff;font-family:"Malgun Gothic","Segoe UI",sans-serif}
 svg{display:block}
 .b{font-weight:700}
 .mono{font-family:Consolas,"Malgun Gothic",monospace}
</style></head><body>
<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dcc3"/><stop offset="1" stop-color="#e9bf9c"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6edf9"/><stop offset="1" stop-color="#c7d4ee"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity=".14"/></filter>
  <marker id="mp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
  <marker id="ma" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
  <marker id="mn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1e3a8a"/></marker>
  <!-- mini body silhouette -->
  <symbol id="sil" viewBox="0 0 40 64">
   <circle cx="20" cy="11" r="9" fill="currentColor"/>
   <path d="M8 26 q12 -6 24 0 v22 q-12 4 -24 0z" fill="currentColor"/>
   <rect x="10" y="48" width="8" height="14" rx="3" fill="currentColor"/>
   <rect x="22" y="48" width="8" height="14" rx="3" fill="currentColor"/>
  </symbol>
</defs>

<!-- ================= 마네킹 (왼쪽) ================= -->
<g transform="translate(60,26)" filter="url(#sh)">
  <!-- 몸 -->
  <path d="M46 118 q54 -26 108 0 v96 q-54 14 -108 0z" fill="url(#body)" stroke="#1e3a8a" stroke-width="2"/>
  <!-- 목 -->
  <rect x="88" y="92" width="24" height="26" rx="6" fill="url(#skin)" stroke="#1e3a8a" stroke-width="2"/>
  <!-- 머리 -->
  <ellipse cx="100" cy="58" rx="40" ry="44" fill="url(#skin)" stroke="#1e3a8a" stroke-width="2"/>
  <!-- 머리카락 (틴트 대상) -->
  <path d="M60 56 a40 40 0 0 1 80 0 q-10 -24 -40 -24 q-30 0 -40 24z" fill="url(#hair)"/>
  <!-- 눈 -->
  <circle cx="86" cy="64" r="2.6" fill="#1e293b"/><circle cx="114" cy="64" r="2.6" fill="#1e293b"/>
  <!-- 안경 (붙은 프롭) -->
  <g fill="none" stroke="#7c3aed" stroke-width="3">
   <rect x="72" y="56" width="24" height="15" rx="5"/><rect x="104" y="56" width="24" height="15" rx="5"/>
   <line x1="96" y1="63" x2="104" y2="63"/>
  </g>
  <!-- 모자 (붙은 프롭) -->
  <path d="M58 36 q42 -46 84 0 l6 4 h-96z" fill="url(#hat)"/>
  <rect x="52" y="38" width="96" height="7" rx="3.5" fill="#991b1b"/>
  <!-- 머리 본 앵커 -->
  <circle cx="100" cy="22" r="5" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="100" cy="22" r="1.8" fill="#7c3aed"/>
</g>
<text x="160" y="300" text-anchor="middle" class="mono" font-size="11" fill="#475569">NpcAppearance.ApplyProfile</text>

<!-- ================= ① 프롭 — 붙이기 (상단) ================= -->
<g transform="translate(330,14)">
  <text x="0" y="16" class="b" font-size="13" fill="#5b21b6">프롭 — 붙이기</text>
  <text x="112" y="16" class="mono" font-size="11" fill="#64748b">Instantiate(prefab, headAnchor)</text>
  <!-- 떠 있는 프리팹들 -->
  <g filter="url(#sh)">
   <g transform="translate(20,30)">
    <rect x="0" y="0" width="64" height="44" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-dasharray="4 3"/>
    <path d="M10 30 q22 -26 44 0 l3 2 h-50z" fill="url(#hat)"/>
    <rect x="7" y="31" width="50" height="4" rx="2" fill="#991b1b"/>
   </g>
   <g transform="translate(96,30)">
    <rect x="0" y="0" width="64" height="44" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-dasharray="4 3"/>
    <g fill="none" stroke="#7c3aed" stroke-width="2.5"><rect x="10" y="16" width="18" height="12" rx="4"/><rect x="36" y="16" width="18" height="12" rx="4"/><line x1="28" y1="22" x2="36" y2="22"/></g>
   </g>
   <g transform="translate(172,30)">
    <rect x="0" y="0" width="64" height="44" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-dasharray="4 3"/>
    <path d="M14 20 q18 20 36 0 q-4 18 -18 18 q-14 0 -18 -18z" fill="#4c1d95"/>
   </g>
  </g>
  <text x="52" y="90" text-anchor="middle" font-size="10" fill="#7c3aed">모자</text>
  <text x="128" y="90" text-anchor="middle" font-size="10" fill="#7c3aed">안경</text>
  <text x="204" y="90" text-anchor="middle" font-size="10" fill="#7c3aed">수염</text>
</g>
<!-- 프리팹 → 머리 앵커 -->
<path d="M 344 66 C 280 60, 230 42, 170 48" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mp)"/>
<text x="238" y="38" text-anchor="middle" font-size="10" fill="#7c3aed">머리 본에 붙임</text>

<!-- ================= ② 색 — 칠하기 (중단) ================= -->
<g transform="translate(330,120)">
  <text x="0" y="16" class="b" font-size="13" fill="#b45309">색 — 칠하기</text>
  <text x="96" y="16" class="mono" font-size="11" fill="#64748b">MaterialPropertyBlock 틴트</text>
  <!-- 팔레트 -->
  <g transform="translate(20,28)" filter="url(#sh)">
   <rect x="0" y="0" width="240" height="46" rx="10" fill="#fff8ec" stroke="#f1d39b"/>
   <text x="12" y="20" font-size="10" fill="#92400e">머리색</text>
   <g transform="translate(58,9)">
    <rect x="0" y="0" width="22" height="22" rx="5" fill="#111827"/>
    <rect x="28" y="0" width="22" height="22" rx="5" fill="#8b5cf6" stroke="#b45309" stroke-width="2.5"/>
    <rect x="56" y="0" width="22" height="22" rx="5" fill="#d97706"/>
    <rect x="84" y="0" width="22" height="22" rx="5" fill="#e11d48"/>
   </g>
   <text x="12" y="40" font-size="10" fill="#92400e">피부색</text>
   <g transform="translate(174,9)">
    <rect x="0" y="0" width="22" height="22" rx="5" fill="#f6dcc3" stroke="#b45309" stroke-width="2.5"/>
    <rect x="28" y="0" width="22" height="22" rx="5" fill="#8d5524"/>
   </g>
  </g>
</g>
<!-- 팔레트 → 머리/피부 -->
<path d="M 350 160 C 300 150, 262 108, 210 84" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ma)"/>
<circle cx="196" cy="78" r="9" fill="none" stroke="#d97706" stroke-width="2"/>
<path d="M 350 172 C 300 180, 250 150, 200 118" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ma)"/>
<circle cx="184" cy="114" r="9" fill="none" stroke="#d97706" stroke-width="2"/>
<text x="272" y="196" text-anchor="middle" font-size="10" fill="#b45309">렌더러별로 덧칠</text>

<!-- ================= ③ 바디 — 켜기 (하단) ================= -->
<g transform="translate(330,212)">
  <text x="0" y="16" class="b" font-size="13" fill="#1e3a8a">바디 — 켜기</text>
  <text x="96" y="16" class="mono" font-size="11" fill="#64748b">variants[i].SetActive(i == index)</text>
  <g transform="translate(20,24)">
   <rect x="0" y="0" width="270" height="62" rx="10" fill="#f4f8ff" stroke="#a9c0ea"/>
   <use href="#sil" x="14" y="6" width="30" height="48" color="#cfd8ea"/>
   <use href="#sil" x="62" y="6" width="30" height="48" color="#1e3a8a"/>
   <use href="#sil" x="110" y="6" width="30" height="48" color="#cfd8ea"/>
   <use href="#sil" x="158" y="6" width="30" height="48" color="#cfd8ea"/>
   <use href="#sil" x="206" y="6" width="30" height="48" color="#cfd8ea"/>
   <rect x="56" y="2" width="42" height="56" rx="8" fill="none" stroke="#1e3a8a" stroke-width="2"/>
   <!-- 토글 스위치 -->
   <rect x="242" y="20" width="22" height="12" rx="6" fill="#1e3a8a"/><circle cx="258" cy="26" r="5" fill="#fff"/>
  </g>
  <text x="97" y="100" text-anchor="middle" class="mono" font-size="10" fill="#1e3a8a">index 1</text>
  <text x="230" y="100" text-anchor="middle" font-size="10" fill="#64748b">같은 스켈레톤 · 메시 교체 없음</text>
</g>
<!-- 바디 → 몸통 -->
<path d="M 350 250 C 300 262, 250 240, 198 218" fill="none" stroke="#1e3a8a" stroke-width="2" marker-end="url(#mn)"/>

<!-- 오른쪽: 한 프로필의 결과 -->
<g transform="translate(660,20)">
  <rect x="0" y="0" width="220" height="292" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="110" y="24" text-anchor="middle" class="b" font-size="12" fill="#334155">int 6개 → 한 사람</text>
  <g transform="translate(18,38)" class="mono" font-size="11" fill="#475569">
   <text x="0" y="14">머리스타일 3</text><text x="98" y="14" fill="#7c3aed">→ 프롭</text>
   <text x="0" y="34">머리색   1</text><text x="98" y="34" fill="#b45309">→ 틴트</text>
   <text x="0" y="54">피부색   2</text><text x="98" y="54" fill="#b45309">→ 틴트</text>
   <text x="0" y="74">수염     0</text><text x="98" y="74" fill="#94a3b8">→ 비움</text>
   <text x="0" y="94">모자     4</text><text x="98" y="94" fill="#7c3aed">→ 프롭</text>
   <text x="0" y="114">안경     1</text><text x="98" y="114" fill="#7c3aed">→ 프롭</text>
  </g>
  <line x1="18" y1="166" x2="202" y2="166" stroke="#e2e8f0"/>
  <text x="110" y="190" text-anchor="middle" font-size="11" fill="#475569">같은 값이면 어느 피어에서도</text>
  <text x="110" y="208" text-anchor="middle" font-size="11" fill="#475569">같은 프리팹·같은 색을 찾아</text>
  <text x="110" y="226" text-anchor="middle" font-size="11" fill="#475569">같은 사람을 그린다</text>
  <text x="110" y="250" text-anchor="middle" class="mono" font-size="10" fill="#94a3b8">AppearanceDatabase</text>
</g>
</svg></body></html>
